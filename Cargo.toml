[workspace]
resolver = "2"
members = [
    "crates/ferret-core",
    "crates/burrow-tree",
    "crates/burrow-cli",
    "crates/burrow",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

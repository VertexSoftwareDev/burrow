name: CI

# Burrow only builds on Windows: it reads NTFS through the Windows API.
on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The unit tests need no disk of their own: the engine's parsers run
      # against hand-built records and the rules against hand-built trees.
      # What does need a real volume - scanning, the change journal, the
      # recycle bin - is checked by `burrow-cli verify` and
      # `burrow --selftest-live`, which need administrator rights and so
      # are run by hand.
      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release --workspace
